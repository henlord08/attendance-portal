<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Attendance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background-color: #f0f2f5; }
        .container { max-width: 500px; }
        #suggestions-container { position: relative; }
        #suggestions {
            position: absolute;
            width: 100%;
            z-index: 1000;
        }
        .logo {
            max-width: 80%; /* Adjust logo size as needed */
            height: auto;
            display: block; /* Ensures it takes its own line */
            margin: 0 auto 10px auto; /* Centers the logo and adds space below */
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center vh-100">

    <div class="container">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <img src="logo.png" alt="Bansalan Coop Logo" class="logo mb-4">
                
                <h2 class="card-title text-center mb-4">
                    <i class="bi bi-calendar-check-fill text-primary"></i> Attendance Portal
                </h2>
                
                <div class="mb-3" id="suggestions-container">
                    <label for="searchBox" class="form-label">Search by ID or Name:</label>
                    <input type="text" class="form-control" id="searchBox" placeholder="Start typing..." autocomplete="off">
                    <div id="suggestions" class="list-group mt-1"></div>
                </div>

              <div class="mb-4">
                    <label class="form-label">Staff ID:</label>
                    <input type="text" class="form-control bg-light" id="staffIdField" readonly>
                    <label class="form-label mt-2">Staff Name:</label>
                    <input type="text" class="form-control bg-light" id="staffNameField" readonly>
                    <label class="form-label mt-2">Branch:</label>
                    <input type="text" class="form-control bg-light" id="staffBranchField" readonly>
                </div>

                <div class="d-grid gap-2">
                    <button id="submitBtn" class="btn btn-success btn-lg" disabled>
                        <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true" style="display: none;"></span>
                        Submit Attendance
                    </button>
                    <button id="exportBtn" class="btn btn-outline-primary">
                        <i class="bi bi-download"></i> Download Records
                    </button>
                </div>

                <div id="status" class="mt-3"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
